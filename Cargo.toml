[package]
name = "mysql_samp"
version = "1.2.0"
edition = "2024"
authors = ["NullSablex <https://github.com/NullSablex>"]
repository = "https://github.com/NullSablex/mysql_samp"
license = "GPL-3.0"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# `compression` gzips rotated log archives. It pulls in flate2, which the mysql
# crate already brings in via `minimal-rust` — so this costs no new dependency.
samp = { package = "rust-samp", git = "https://github.com/NullSablex/rust-samp.git", tag = "v3.4.0", features = ["compression"] }
# `rustls-tls-ring` is what actually compiles a TLS backend in. Without it the
# crate's `make_secure` is a `panic!` stub, so MYSQL_OPT_SSL would abort the
# connection instead of encrypting it. `ring` rather than the default
# `aws_lc_rs` because it cross-compiles to i686 (incl. MSVC via cargo-xwin).
mysql = { version = "28.0.0", default-features = false, features = ["default-rust", "rustls-tls-ring"] }
# Argon2id password hashing. `std` for the error types; the default features
# already bring `password-hash` (PHC string format) and `rand` (salt generation).
argon2 = { version = "0.5", features = ["std"] }
# Only for `Dispatch::into_log()` on the console sink returned by
# `samp::plugin::logger()`. Must track the SDK's own fern version.
fern = "0.7"

[package.metadata.samp]
uid = "0x4e10002241c700f4"
