# CodeQL advanced setup. Reusable: called by ci.yml when Rust or workflow
# sources change; the weekly run keeps the master baseline current with new
# queries. Categories stay `/language:actions` and `/language:rust`.
name: CodeQL

on:
  workflow_call:
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload the SARIF results
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the languages the previous default setup covered.
        language: [ actions, rust ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          # Neither language needs a compiled build for CodeQL to extract it.
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
