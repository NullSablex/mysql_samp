name: Rust

# Reusable: called by ci.yml when Rust sources, includes or Cargo inputs change.
on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Default: read-only. Each job opts in to extra scopes when needed.
permissions:
  contents: read

jobs:
  build:
    name: Build, test, clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (stable + clippy)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: i686-unknown-linux-gnu
          components: clippy

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --target i686-unknown-linux-gnu --verbose

      - name: Test
        run: cargo test --target i686-unknown-linux-gnu --verbose

      - name: Clippy
        run: cargo clippy --target i686-unknown-linux-gnu --all-targets -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable + rustfmt)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  coverage:
    name: Coverage (llvm-cov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (stable + llvm-tools)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: i686-unknown-linux-gnu
          components: llvm-tools-preview

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-llvm-cov

      - name: Generate LCOV report
        run: cargo llvm-cov --target i686-unknown-linux-gnu --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
