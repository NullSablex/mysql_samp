name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  # Daily, for the security audit only (the other jobs opt out below). A new
  # advisory against a dependency we already ship is not something a pull
  # request introduces, so waiting for one to be opened is the wrong trigger:
  # it turns an unrelated PR red instead of telling us. On a schedule,
  # rustsec/audit-check opens an issue instead.
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Default: read-only. Each job opts in to extra scopes when needed.
permissions:
  contents: read

jobs:
  build:
    name: Build, test, clippy
    # The daily run exists for the audit; there is no new code to build.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (stable + clippy)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: i686-unknown-linux-gnu
          components: clippy

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Build
        run: cargo build --target i686-unknown-linux-gnu --verbose

      - name: Test
        run: cargo test --target i686-unknown-linux-gnu --verbose

      - name: Clippy
        run: cargo clippy --target i686-unknown-linux-gnu --all-targets -- -D warnings

  fmt:
    name: Rustfmt
    # The daily run exists for the audit; there is no new code to build.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable + rustfmt)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    # rustsec/audit-check opens issues for new advisories and posts review
    # comments on PRs that introduce vulnerable dependencies. This is the only
    # job that also runs on the daily schedule: an advisory published against a
    # crate already in Cargo.lock arrives on the RustSec database's clock, not
    # on ours, and should reach us as an issue rather than as a red check on
    # whatever pull request happened to be open at the time.
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: Coverage (llvm-cov)
    # The daily run exists for the audit; there is no new code to build.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (stable + llvm-tools)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: i686-unknown-linux-gnu
          components: llvm-tools-preview

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: cargo-llvm-cov

      - name: Generate LCOV report
        run: cargo llvm-cov --target i686-unknown-linux-gnu --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
