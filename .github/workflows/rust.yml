name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  # Weekly, for the security audit only (the other jobs opt out below).
  #
  # The first line of defence is Dependabot: it now tracks transitive crates
  # too, so a patched version lands as an ordinary lockfile pull request and
  # gets audited on the way in. This job is the second line, for what that
  # misses - an advisory RustSec publishes and the GitHub Advisory Database
  # does not carry, which is exactly what RUSTSEC-2026-0285 was, or one with
  # no fixed version to bump to. Waiting for someone to open a pull request
  # is the wrong trigger for that: it turns an unrelated PR red instead of
  # telling us. On a schedule, rustsec/audit-check opens an issue instead.
  #
  # Mondays, a few hours before Dependabot's weekly run, so the two do not
  # report the same thing twice.
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Default: read-only. Each job opts in to extra scopes when needed.
permissions:
  contents: read

jobs:
  build:
    name: Build, test, clippy
    # The daily run exists for the audit; there is no new code to build.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (stable + clippy)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: i686-unknown-linux-gnu
          components: clippy

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Build
        run: cargo build --target i686-unknown-linux-gnu --verbose

      - name: Test
        run: cargo test --target i686-unknown-linux-gnu --verbose

      - name: Clippy
        run: cargo clippy --target i686-unknown-linux-gnu --all-targets -- -D warnings

  fmt:
    name: Rustfmt
    # The daily run exists for the audit; there is no new code to build.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable + rustfmt)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    # rustsec/audit-check opens issues for new advisories and posts review
    # comments on PRs that introduce vulnerable dependencies. This is the only
    # job that also runs on the daily schedule: an advisory published against a
    # crate already in Cargo.lock arrives on the RustSec database's clock, not
    # on ours, and should reach us as an issue rather than as a red check on
    # whatever pull request happened to be open at the time.
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: Coverage (llvm-cov)
    # The daily run exists for the audit; there is no new code to build.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (stable + llvm-tools)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: i686-unknown-linux-gnu
          components: llvm-tools-preview

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-llvm-cov

      - name: Generate LCOV report
        run: cargo llvm-cov --target i686-unknown-linux-gnu --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
