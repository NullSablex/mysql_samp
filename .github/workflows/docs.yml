name: Docs

# Reusable: called by ci.yml when documentation inputs change. Publishes to
# GitHub Pages only for pushes to master (or a manual run on master).
# docs/api-reference.md is generated from the includes on every build and is
# never committed, so it cannot go stale.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
      - name: Generate the natives page
        run: |
          python3 scripts/gen_natives_page.py --selftest
          python3 scripts/gen_natives_page.py --check
          python3 scripts/gen_natives_page.py
      - name: Build without warnings
        run: uv tool run --python 3.13 --from "$(cat requirements-docs.txt)" zensical build --strict --config-file zensical.toml
      - name: Prepare GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: Publish documentation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
