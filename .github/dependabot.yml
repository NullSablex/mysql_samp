version: 2

# One entry per area, so each update PR only touches (and only triggers the CI
# checks of) its own area: the plugin, the workflows and the docs generator.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
    # Transitive dependencies too: `rustls` arrives through `mysql`, like most
    # of the lockfile. Tracking only the manifest is what let RUSTSEC-2026-0285
    # sit in Cargo.lock until `cargo audit` failed an unrelated PR.
    allow:
      - dependency-type: all
    groups:
      plugin:
        patterns: ["*"]
        update-types: [minor, patch]
      plugin-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: docs(deps)

  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(toolchain)
